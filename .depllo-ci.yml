# Depllo CI/CD for saas-suppuo — PHASE B (full cutover: CI + staging/prod
# deploys run on Depllo; GHA workflows remain as manual-dispatch fallback).
#
# Deploys ride PUBLIC hostnames (stg-share/prod-share, verified reachable
# from runner containers on :22) with the depllo-deploy key delivered as a
# file-type project variable ($SSH_PRIVATE_KEY = path inside the job).
# Release + visual-regression stay on GHA workflow_dispatch — both need a
# GitHub write token that Depllo jobs don't carry.
stages:
  - test
  - build
  - deploy
# Fallback for any job without its own `timeout:` (today: lint/test-class
# jobs; heavier jobs all declare one). The engine default is 1h — too
# loose to be useful: a wedged npm ci held a runner slot for 32 minutes
# on 2026-08-05 and would have sat there for the full hour.
default:
  timeout: 20m
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" ||
        $CI_COMMIT_BRANCH == "master")
    - if: $CI_PIPELINE_SOURCE == "pull_request"
    - if: $CI_PIPELINE_SOURCE == "manual"
lint:
  stage: test
  image: node:22-bookworm
  script:
    - "# -- Workflow shell sanity"
    - (
    - "  python3 scripts/check-workflow-continuations.py"
    - )
    - "# -- Backend type check"
    - (
    - "  cd backend && npm ci && npm run type-check"
    - )
    - "# -- Frontend lint"
    - (
    - "  cd frontend && npm ci && npm run lint"
    - )
test:
  stage: test
  image: node:22-bookworm
  services:
    - name: postgres:16
      alias: postgres
      variables:
        POSTGRES_PASSWORD: test
        POSTGRES_DB: suppuo_test
    - name: redis:7
      alias: redis
  script:
    - "# wait for the postgres service to accept connections"
    - for i in $(seq 1 30); do (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1
      && break; sleep 1; done
    - "# -- Backend tests"
    - (
    - "  cd backend && npm ci"
    - |2-
        DATABASE_URL=postgresql://postgres:test@postgres:5432/suppuo_test \
        npx prisma migrate deploy
    - |2-
        DATABASE_URL=postgresql://postgres:test@postgres:5432/suppuo_test \
        REDIS_URL=redis://redis:6379 \
        JWT_SECRET=test-secret JWT_REFRESH_SECRET=test-refresh-secret \
        npm test
    - )
    - "# -- Frontend tests"
    - (
    - "  cd frontend && npm ci && npm test"
    - )
apigen-check:
  stage: test
  image: node:22-bookworm
  script:
    - "# -- The API spec (backend/openapi.json) is made from the backend's own code;"
    - "# -- the API reference docs, the CLI's `suppuo api` commands and the SDKs'"
    - "# -- client.api are made from the spec. Fail when any of them is out of date:"
    - "# -- run ./scripts/apigen.sh and commit."
    - ./scripts/apigen.sh --check
build-production:
  stage: build
  image: node:22-bookworm
  needs:
    - lint
    - test
    - apigen-check
  timeout: 30m
  artifacts:
    paths:
      - backend/dist/
      - backend/package.json
      - backend/package-lock.json
      - backend/prisma/
      - frontend/.next/
      - frontend/public/
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/next.config.*
  script:
    - "# -- Build backend"
    - (
    - "  cd backend && npm ci && npx prisma generate && npm run build"
    - )
    - "# -- Build frontend (production — Turnstile site key inlined)"
    - export NEXT_PUBLIC_API_URL="/api/v1"
    - export NEXT_PUBLIC_MIDTRANS_CLIENT_KEY="$MIDTRANS_CLIENT_KEY"
    - export NEXT_PUBLIC_TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY"
    - (
    - "  cd frontend && npm ci && npm run build"
    - )
deploy-production:
  resource_group: production
  stage: deploy
  image: node:22-bookworm
  needs: [build-production]
  dependencies:
    - build-production
  timeout: 30m
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "pull_request"
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends
      rsync openssh-client >/dev/null
    - |-
      mkdir -p /tmp/payload
      cp -r --parents backend/dist backend/package.json backend/package-lock.json backend/prisma copy /tmp/payload/
      cp -r --parents frontend/.next frontend/public frontend/package.json frontend/package-lock.json /tmp/payload/
      for f in frontend/next.config.*; do { [ -e "$f" ] && cp -r --parents "$f" /tmp/payload/; } || true; done
    - |-
      rsync -az --delete \
        --exclude node_modules --exclude .git --exclude .env --exclude .npmrc --exclude frontend/.next/cache \
        -e "ssh -i $SSH_PRIVATE_KEY -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30" \
        /tmp/payload/backend /tmp/payload/frontend /tmp/payload/copy root@$PRODUCTION_HOST:/opt/saas/suppuo/
    - |-
      ssh -i "$SSH_PRIVATE_KEY" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 root@$PRODUCTION_HOST 'bash -se' <<SCRIPT
      cd /opt/saas/suppuo/backend
      sed -i '/^TURNSTILE_SECRET_KEY=/d' .env 2>/dev/null || true
      echo 'TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY' >> .env
      sed -i '/^TURNSTILE_ALLOWED_HOSTNAMES=/d' .env 2>/dev/null || true
      echo 'TURNSTILE_ALLOWED_HOSTNAMES=$TURNSTILE_ALLOWED_HOSTNAMES' >> .env
      npm ci --omit=dev
      npx prisma generate
      npx prisma migrate deploy
      pm2 restart suppuo || pm2 start dist/index.js --name suppuo -i 1
      cd /opt/saas/suppuo/frontend
      npm ci --omit=dev
      pm2 restart suppuo-frontend || pm2 start npm --name suppuo-frontend -- start
      pm2 save
      echo "Waiting for backend health..."
      for i in \$(seq 1 30); do
        curl -sf http://localhost:4170/api/v1/health >/dev/null 2>&1 && { echo "backend healthy after \${i}s"; break; }
        sleep 1
      done
      echo "Waiting for frontend..."
      for i in \$(seq 1 30); do
        curl -sf http://localhost:3170/ >/dev/null 2>&1 && { echo "frontend healthy after \${i}s"; break; }
        sleep 1
      done
      SCRIPT
verify-production:
  # Read-only, from outside, after every production deploy. It replaces the staging
  # e2e (no more staging, bang 22 Oct 2026): the site must answer 200 within 2 minutes.
  resource_group: production
  stage: deploy
  image: node:22-bookworm
  needs: [deploy-production]
  dependencies: []
  timeout: 10m
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "pull_request"
  script:
    - |-
      for i in $(seq 1 24); do
        STATUS=$(curl -sL -o /dev/null -w '%{http_code}' "https://$PRODUCTION_HOST/" 2>/dev/null || echo 000)
        [ "$STATUS" = "200" ] && { echo "production answers 200"; exit 0; }
        sleep 5
      done
      echo "production still answers $STATUS after 2 minutes"; exit 1
sync-sdk-mirrors:
  stage: deploy
  image: node:22-bookworm
  needs:
    - lint
    - test
  dependencies: []
  timeout: 15m
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "pull_request"
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends
      rsync >/dev/null
    - "# One-way sync of cli/ (+ sdk dirs when published) to the public mirrors ($GH_MIRROR_TOKEN)"
    - ./scripts/sync-sdk-mirrors.sh
